<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voti</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #f0f0f0;
    }

    .paese {
      text-align: left;
      font-weight: 600;
    }

    select {
      font-size: 16px;
      width: 100%;
    }
  </style>
</head>
<body>

<h2>Voti</h2>

<table>
  <tr>
    <th>Paese</th>
    <th>Performance</th>
    <th>Scenografia</th>
    <th>Musica</th>
    <th>Media</th>
  </tr>

  <tr>
    <td class="paese">🇮🇹 Italia</td>
    <td><select onchange="calcola(this)"></select></td>
    <td><select onchange="calcola(this)"></select></td>
    <td><select onchange="calcola(this)"></select></td>
    <td class="media">0</td>
  </tr>

  <tr>
    <td class="paese">🇸🇪 Svezia</td>
    <td><select onchange="calcola(this)"></select></td>
    <td><select onchange="calcola(this)"></select></td>
    <td><select onchange="calcola(this)"></select></td>
    <td class="media">0</td>
  </tr>
</table>

<script>
  // popola i menu (1–10 con step 0.5)
  document.querySelectorAll("select").forEach(sel => {
    for (let i = 1; i <= 10; i += 0.5) {
      const opt = document.createElement("option");
      opt.value = i;
      opt.text = i;
      sel.appendChild(opt);
    }
  });

  function calcola(el) {
    const row = el.parentElement.parentElement;
    let sum = 0;
    let count = 0;

    row.querySelectorAll("select").forEach(s => {
      sum += Number(s.value);
      count++;
    });

    const media = Math.round((sum / count) * 2) / 2;
    row.querySelector(".media").innerText = media.toFixed(1);
  }
</script>

</body>
</html>
